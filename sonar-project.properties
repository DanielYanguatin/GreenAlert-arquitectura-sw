# GreenAlert · configuración de análisis SonarQube
# El Quality Gate se define en el servidor (ver docs/12-informe-calidad-codigo.md §4).
sonar.projectKey=greenalert
sonar.projectName=GreenAlert - Monitoreo Ambiental Ciudadano
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8

sonar.sources=api-gateway/src,services/users/src,services/reports/src,services/multimedia/src,services/geolocation/src,services/ai/src,services/notifications/src,frontend/src
sonar.tests=api-gateway/src,api-gateway/test,services/users/src,services/users/test,services/reports/src,services/reports/test,services/multimedia/src,services/multimedia/test,services/geolocation/src,services/geolocation/test,services/ai/src,services/ai/test,services/notifications/src,services/notifications/test,frontend/src,frontend/test
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/*.int-spec.ts,**/test/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/coverage-integration/**,**/*.spec.ts,**/*.spec.tsx
# Las migraciones son SQL declarativo; los DTO son declaraciones de validación sin lógica.
sonar.coverage.exclusions=**/database/migrations/**,**/database/data-source.ts,**/main.ts,**/*.module.ts,**/dto/**,frontend/src/main.tsx,frontend/src/env.ts
sonar.cpd.exclusions=**/database/migrations/**,**/dto/**

sonar.javascript.lcov.reportPaths=api-gateway/coverage/lcov.info,services/users/coverage/lcov.info,services/reports/coverage/lcov.info,services/multimedia/coverage/lcov.info,services/geolocation/coverage/lcov.info,services/ai/coverage/lcov.info,services/notifications/coverage/lcov.info,frontend/coverage/lcov.info,api-gateway/coverage-integration/lcov.info,services/users/coverage-integration/lcov.info,services/reports/coverage-integration/lcov.info,services/multimedia/coverage-integration/lcov.info,services/geolocation/coverage-integration/lcov.info,services/ai/coverage-integration/lcov.info,services/notifications/coverage-integration/lcov.info

# Hace fallar el análisis (y el job de CI) si no se supera el Quality Gate.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
