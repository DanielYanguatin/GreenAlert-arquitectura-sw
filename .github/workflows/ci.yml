# GreenAlert · Integración continua
# Controles obligatorios para fusionar en main (configurar en GitHub → Settings → Branches →
# Branch protection rule → "Require status checks to pass": quality, integration, security, docker).
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  # Umbral de cobertura configurable desde Settings → Variables (no se fija el 85 % sin confirmar su significado).
  COVERAGE_THRESHOLD: ${{ vars.COVERAGE_THRESHOLD || '0' }}

jobs:
  quality:
    name: TypeScript · ESLint · Build · Pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Verificación de tipos
        run: npm run typecheck
      - name: ESLint (0 errores, 0 advertencias)
        run: npm run lint
      - name: Formato (Prettier)
        run: npm run format:check
      - name: Compilación
        run: npm run build
      - name: Pruebas unitarias con cobertura
        run: npm run test:cov
      - name: Publicar cobertura e informes JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-reports
          path: |
            **/coverage/lcov.info
            **/coverage/coverage-summary.json
            **/reports/junit/*.xml
            !node_modules/**

  integration:
    name: Pruebas de integración (MySQL real)
    runs-on: ubuntu-latest
    needs: quality
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: '3306'
      TEST_DB_ROOT_PASSWORD: ci-root-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Pruebas de integración de todos los servicios y el gateway (con cobertura)
        run: npm run test:integration:cov
      - name: Publicar cobertura e informes JUnit de integración
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-reports
          path: |
            **/coverage-integration/lcov.info
            **/coverage-integration/coverage-summary.json
            **/reports/junit/integration.xml
            !node_modules/**

  security:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: npm audit (dependencias de producción, bloquea en severidad alta o crítica)
        run: npm audit --omit=dev --audit-level=high
      - name: Informe completo (incluye desarrollo, no bloqueante)
        if: always()
        run: npm audit --json > npm-audit.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: npm-audit, path: npm-audit.json }

  sonarqube:
    name: Análisis SonarQube
    runs-on: ubuntu-latest
    needs: [quality, integration]
    # Solo se ejecuta si el repositorio tiene configurado el servidor y el token de SonarQube.
    if: ${{ vars.SONAR_HOST_URL != '' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { name: unit-reports }
      - uses: actions/download-artifact@v4
        with: { name: integration-reports }
      - name: SonarQube Scan (espera el Quality Gate)
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  docker:
    name: Construcción de imágenes Docker
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: users, file: services/users/Dockerfile }
          - { name: reports, file: services/reports/Dockerfile }
          - { name: multimedia, file: services/multimedia/Dockerfile }
          - { name: geolocation, file: services/geolocation/Dockerfile }
          - { name: ai, file: services/ai/Dockerfile }
          - { name: notifications, file: services/notifications/Dockerfile }
          - { name: api-gateway, file: api-gateway/Dockerfile }
          - { name: frontend, file: frontend/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir ${{ matrix.image.name }} (sin publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.file }}
          push: false
          tags: greenalert/${{ matrix.image.name }}:ci
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
      - name: Validar docker-compose.yml
        if: matrix.image.name == 'users'
        run: cp .env.example .env && docker compose config --quiet
